server {
    listen 80;
    server_name suah-hotel.com www.suah-hotel.com; # O la IP pública de tu instancia EC2

    client_max_body_size 20M;

    # Archivos estáticos de Django y Tailwind
    location /static/ {
        alias /var/www/suah_hotel/hotelSUAH/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy inverso hacia Gunicorn (Servidor WSGI de Django)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cabeceras de seguridad recomendadas por OWASP
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}
