{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SUAH - Sistema Hotelero Integral{% endblock %}</title>
  
  <!-- BOOTSTRAP 5 LOCAL (Del proyecto biblioteca de la carrera) -->
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <!-- ICONOS BOOTSTRAP -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    /* Estilos personalizados del Hotel SUAH sobre Bootstrap */
    :root {
      --suah-dark: #1a1a1a;
      --suah-gold: #b89645;
      --suah-gold-hover: #967a36;
    }

    body {
      background-color: #f8f9fa;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .bg-suah-dark { background-color: var(--suah-dark) !important; color: #fff; }
    .text-suah-gold { color: var(--suah-gold) !important; }
    .bg-suah-gold { background-color: var(--suah-gold) !important; color: #fff; }
    .bg-suah-gold:hover { background-color: var(--suah-gold-hover) !important; }
    .border-suah-gold { border-color: var(--suah-gold) !important; }

    /* Tarjetas de Habitación en Matriz */
    .room-card {
      transition: all 0.2s ease-in-out;
      cursor: pointer;
      border-radius: 0.75rem;
    }
    .room-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
    }

    /* Notificaciones / Toasts Flotantes Superiores Centradas */
    #toast-container {
      position: fixed;
      top: 1.75rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      pointer-events: none;
      width: 90%;
      max-width: 550px;
    }
    .suah-toast {
      pointer-events: auto;
      animation: toastSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25) !important;
    }
    @keyframes toastSlideDown {
      from {
        opacity: 0;
        transform: translateY(-25px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  {% csrf_token %}

  {% block content %}{% endblock %}

  <!-- Contenedor Toasts Flotantes -->
  <div id="toast-container"></div>

  <!-- BOOTSTRAP 5 JS BUNDLE LOCAL -->
  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

  <script>
    function getCsrfToken() {
      const input = document.querySelector('[name=csrfmiddlewaretoken]');
      if (input) return input.value;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, 10) === 'csrftoken=') {
            return decodeURIComponent(cookie.substring(10));
          }
        }
      }
      return '';
    }
    const csrftoken = getCsrfToken();

    function showToast(message, type = 'info', duration = 7000) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      
      let bgClass = 'bg-dark text-white border border-light border-opacity-25';
      let icon = '<i class="bi bi-info-circle-fill fs-4 me-3 text-info"></i>';
      let title = 'Información del Sistema';

      if(type === 'success') { 
        bgClass = 'bg-success text-white border-0'; 
        icon = '<i class="bi bi-check-circle-fill fs-3 me-3"></i>'; 
        title = 'Operación Exitosa';
      } else if(type === 'warning') { 
        bgClass = 'bg-warning text-dark border-0'; 
        icon = '<i class="bi bi-exclamation-triangle-fill fs-3 me-3 text-dark"></i>'; 
        title = 'Atención Requerida';
      } else if(type === 'error') { 
        bgClass = 'bg-danger text-white border-0'; 
        icon = '<i class="bi bi-x-octagon-fill fs-3 me-3"></i>'; 
        title = 'Error del Sistema';
      }

      toast.className = `alert ${bgClass} suah-toast py-3 px-4 rounded-4 d-flex align-items-center justify-content-between mb-0 w-100`;
      toast.innerHTML = `
        <div class="d-flex align-items-center">
          ${icon}
          <div>
            <div class="fw-bold small text-uppercase opacity-75">${title}</div>
            <div class="fs-6 fw-semibold">${message}</div>
          </div>
        </div>
        <button type="button" class="btn-close ${type === 'warning' ? '' : 'btn-close-white'} ms-3" aria-label="Cerrar" onclick="this.closest('.suah-toast').remove()"></button>
      `;

      container.appendChild(toast);

      // Duración extendida de 7 segundos para que el usuario y profesor alcancen a leer y fotografiar
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-15px) scale(0.95)';
        setTimeout(() => toast.remove(), 350);
      }, duration);
    }
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
