{% extends 'base.html' %}

{% block title %}Acceso Empleados - SUAH Intranet{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-suah-dark py-5">
  <div class="container" style="max-width: 440px;">
    
    <div class="card shadow-lg border-0 rounded-4 p-4 text-dark bg-white position-relative">
      
      <a href="{% url 'index' %}" class="position-absolute top-0 end-0 mt-3 me-3 text-secondary text-decoration-none small">
        <i class="bi bi-arrow-left"></i> Volver Web
      </a>

      <div class="text-center mb-4 mt-2">
        <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle mb-2" style="width: 52px; height: 52px;">
          <i class="bi bi-shield-lock-fill text-suah-gold fs-3"></i>
        </div>
        <h2 class="h4 fw-bold text-suah-gold mb-1">SUAH INTRANET</h2>
        <p class="text-muted small mb-0">Acceso de Personal y Administración</p>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2 px-3 small text-center mb-3">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
      </div>
      {% endif %}

      <!-- FORMULARIO DE ACCESO DIRECTO CON CREDENCIALES -->
      <form method="POST" action="{% url 'login_admin' %}">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">CORREO INSTITUCIONAL</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-fill text-muted"></i></span>
            <input type="email" name="email" required placeholder="ej: rep@suah.cl" class="form-control border-start-0">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">CONTRASEÑA</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key-fill text-muted"></i></span>
            <input type="password" name="password" required placeholder="****" class="form-control border-start-0">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
          Iniciar Sesión <i class="bi bi-box-arrow-in-right ms-1"></i>
        </button>
      </form>

    </div>
  </div>
</div>
{% endblock %}
